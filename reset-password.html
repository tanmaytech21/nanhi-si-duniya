<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Nanhi Duniya</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            background: #161b22;
            border-radius: 15px;
            color: white;
        }

        .auth-container h1,
        .auth-container p {
            text-align: center;
        }

        .auth-container label {
            display: block;
            margin: 18px 0 8px;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #444;
            border-radius: 8px;
            background: #222a33;
            color: white;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #ff8fab;
            color: #161b22;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #resetMessage {
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h1>🔐 Reset Password</h1>
        <p>Create a new Nanhi Duniya password ❤️</p>

        <form id="resetPasswordForm">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword"
                placeholder="Enter new password"
                minlength="8" autocomplete="new-password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                placeholder="Enter password again"
                minlength="8" autocomplete="new-password" required>

            <button type="submit" id="resetButton">
                Update Password ❤️
            </button>
        </form>

        <p id="resetMessage" aria-live="polite"></p>

        <a href="login.html">← Back to Parent Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <script>
        const form = document.getElementById("resetPasswordForm");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const button = document.getElementById("resetButton");
        const message = document.getElementById("resetMessage");

        let recoveryReady = false;

        async function prepareReset() {
            try {
                const url = new URL(window.location.href);
                const code = url.searchParams.get("code");

                if (code) {
                    const { error } =
                        await supabaseClient.auth.exchangeCodeForSession(code);
                    if (error) throw error;
                }

                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) throw error;

                if (!data.session) {
                    throw new Error("Reset link is invalid or expired.");
                }

                recoveryReady = true;
                message.textContent = "Enter your new password ❤️";

            } catch (error) {
                console.error(error);
                message.textContent =
                    "Invalid or expired link. Request a new reset email.";
                button.disabled = true;
            }
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!recoveryReady) {
                message.textContent = "Please open the reset link from your email.";
                return;
            }

            if (newPassword.value.length < 8) {
                message.textContent = "Password must be at least 8 characters.";
                return;
            }

            if (newPassword.value !== confirmPassword.value) {
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword.value
                });

                if (error) throw error;

                message.textContent =
                    "Password updated successfully! ❤️";

                await supabaseClient.auth.signOut();

                setTimeout(function() {
    const url = new URL(window.location.href);
    const isAdminReset = url.searchParams.get("flow") === "admin";

    if (isAdminReset) {
        window.location.replace("admin-login.html");
    } else {
        window.location.replace("login.html");
    }
}, 1800);

            } catch (error) {
                console.error(error);
                message.textContent =
                    error.message || "Password update failed. Try again.";
                button.disabled = false;
                button.textContent = "Update Password ❤️";
            }
        });

        prepareReset();
    </script>
</body>
</html>
