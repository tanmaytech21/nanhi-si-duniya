<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parent Login | Nanhi Duniya</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .auth-container > p {
color: #786b70;
font-size: 14px;
line-height: 1.8;
}
        
        .auth-container {
width: calc(100% - 40px);
max-width: 440px;
margin: 60px auto;
padding: 36px;
box-sizing: border-box;
background: linear-gradient(145deg, #ffffff, #fffaf5);
border: 1px solid #f0e3e5;
border-top: 4px solid #b99a62;
border-radius: 24px;
color: #33252b;
box-shadow: 0 18px 45px rgba(75, 43, 55, 0.12);
animation: cardAppear 0.7s ease-out;
}

        .auth-container h1,
        .auth-container p {
            text-align: center;
        }

        .auth-container h1 {
color: #33252b;
font-family: Georgia, serif;
font-size: clamp(27px, 5vw, 34px);
margin-bottom: 14px;
letter-spacing: 0.3px;
}

        .auth-container p {
            color: #cccccc;
        }

        .auth-container label {
display: block;
margin: 20px 0 9px;
color: #49343d;
font-size: 14px;
font-weight: 700;
letter-spacing: 0.3px;
}

       .auth-container input {
width: 100%;
padding: 14px 15px;
box-sizing: border-box;
border: 1px solid #f0e3e5;
border-radius: 12px;
background: #fffafc;
color: #33252b;
font-size: 15px;
font-family: inherit;
transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.auth-container input:focus {
outline: none;
border-color: #c96f91;
background: #ffffff;
box-shadow: 0 0 0 4px rgba(201, 111, 145, 0.14);
}

        .auth-container button {
width: 100%;
padding: 15px;
margin-top: 20px;
background: linear-gradient(135deg, #c96f91, #a94e72);
color: #ffffff;
border: none;
border-radius: 12px;
cursor: pointer;
font-size: 16px;
font-weight: 700;
letter-spacing: 0.4px;
box-shadow: 0 8px 20px rgba(201, 111, 145, 0.22);
transition: all 0.3s ease;
}

.auth-container button:hover:not(:disabled) {
transform: translateY(-3px);
background: linear-gradient(135deg, #a94e72, #8f3d60);
box-shadow: 0 12px 28px rgba(201, 111, 145, 0.32);
}

.auth-container button:active:not(:disabled) {
transform: translateY(0);
}

        .auth-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-password {
display: block;
width: fit-content;
margin: 12px 0 0 auto;
color: #a94e72;
font-size: 13px;
font-weight: 600;
text-decoration: none;
transition: color 0.3s ease;
}

.forgot-password:hover {
color: #c96f91;
text-decoration: underline;
}

        #loginMessage,
        #resetMessage {
            overflow-wrap: anywhere;
        }

        .back-home {
display: block;
text-align: center;
margin-top: 22px;
color: #a94e72;
font-size: 14px;
font-weight: 600;
text-decoration: none;
transition: color 0.3s ease;
}

.back-home:hover {
color: #c96f91;
text-decoration: underline;
}

#loginMessage,
#resetMessage {
margin-top: 14px;
padding: 10px;
border-radius: 10px;
font-size: 13px;
line-height: 1.7;
text-align: center;
overflow-wrap: anywhere;
}

.auth-container a:not(.forgot-password):not(.back-home) {
color: #a94e72;
font-weight: 600;
text-decoration: none;
transition: color 0.3s ease;
}

.auth-container a:not(.forgot-password):not(.back-home):hover {
color: #c96f91;
text-decoration: underline;
}

@media (max-width: 480px) {
.auth-container {
margin: 25px auto;
padding: 26px 20px;
border-radius: 20px;
}
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

    </style>
</head>

<body>

    <div class="auth-container">

        <h1>🧸 Parent Login</h1>

        <p>Welcome back to Nanhi Duniya ❤️</p>

        <form id="loginForm">

            <label for="loginEmail">Email Address</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="loginPassword">Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <a href="#" class="forgot-password" id="forgotPassword">
                Forgot Password?
            </a>

            <button type="submit" id="loginButton">
                Login ❤️
            </button>

        </form>

        <p id="loginMessage" aria-live="polite"></p>
        <p id="resetMessage" aria-live="polite"></p>

        <p>
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <script>
        const forgotPasswordLink = document.getElementById("forgotPassword");
        const emailInput = document.getElementById("loginEmail");
        const resetMessage = document.getElementById("resetMessage");

        forgotPasswordLink.addEventListener("click", async function(event) {
            event.preventDefault();

            const email = emailInput.value.trim();

            resetMessage.textContent = "";

            if (!email) {
                resetMessage.textContent =
                    "Please enter your registered email address first.";
                emailInput.focus();
                return;
            }

            forgotPasswordLink.style.pointerEvents = "none";
            forgotPasswordLink.textContent = "Sending reset link...";

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo: window.location.origin + "/reset-password.html"
                    }
                );

                if (error) {
                    throw error;
                }

                resetMessage.textContent =
                    "If this email is registered, a password reset link will be sent. Please check your inbox and spam folder. ❤️";

            } catch (error) {
                console.error("Password reset error:", error);

                resetMessage.textContent =
                    "Could not send the reset email. Please check your email and try again.";
            } finally {
                forgotPasswordLink.style.pointerEvents = "auto";
                forgotPasswordLink.textContent = "Forgot Password?";
            }
        });
    </script>

</body>
</html>
