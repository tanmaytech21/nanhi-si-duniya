<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parent Login | Nanhi Duniya</title>

    <link rel="stylesheet" href="style.css">

    <style>
        
        .auth-container {
width: calc(100% - 40px);
max-width: 440px;
margin: 60px auto;
padding: 36px;
box-sizing: border-box;
background: linear-gradient(145deg, #ffffff, #fffaf5);
border: 1px solid #f0e3e5;
border-top: 4px solid #b99a62;
border-radius: 24px;
color: #33252b;
box-shadow: 0 18px 45px rgba(75, 43, 55, 0.12);
animation: cardAppear 0.7s ease-out;
}


        .auth-container h1 {
text-align: center;
color: #33252b;
font-family: Georgia, serif;
font-size: clamp(27px, 5vw, 34px);
margin-bottom: 14px;
letter-spacing: 0.3px;
}

        .auth-container p {
text-align: center;
color: #786b70;
font-size: 14px;
line-height: 1.8;
}

.auth-container label {
display: block;
margin: 20px 0 9px;
color: #49343d;
font-size: 14px;
font-weight: 700;
letter-spacing: 0.3px;
}

        .auth-container input {
width: 100%;
padding: 14px 15px;
box-sizing: border-box;
border: 1px solid #f0e3e5;
border-radius: 12px;
background: #fffafc;
color: #33252b;
font-size: 15px;
font-family: inherit;
transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.auth-container input:focus {
outline: none;
border-color: #c96f91;
background: #ffffff;
box-shadow: 0 0 0 4px rgba(201, 111, 145, 0.14);
}

.auth-container button {
width: 100%;
padding: 15px;
margin-top: 20px;
background: linear-gradient(135deg, #c96f91, #a94e72);
color: #ffffff;
border: none;
border-radius: 12px;
cursor: pointer;
font-size: 16px;
font-weight: 700;
letter-spacing: 0.4px;
box-shadow: 0 8px 20px rgba(201, 111, 145, 0.22);
transition: all 0.3s ease;
}

.auth-container button:hover:not(:disabled) {
transform: translateY(-3px);
background: linear-gradient(135deg, #a94e72, #8f3d60);
box-shadow: 0 12px 28px rgba(201, 111, 145, 0.32);
}

.auth-container button:active:not(:disabled) {
transform: translateY(0);
}

        .auth-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-container button:disabled {
box-shadow: none;
transform: none;
}

       #authMessage {
margin-top: 16px;
padding: 10px;
border-radius: 10px;
font-size: 13px;
line-height: 1.7;
text-align: center;
overflow-wrap: anywhere;
}

       .back-home {
display: block;
text-align: center;
margin-top: 22px;
color: #a94e72;
font-size: 14px;
font-weight: 600;
text-decoration: none;
transition: color 0.3s ease;
}

.back-home:hover {
color: #c96f91;
text-decoration: underline;
}

@keyframes cardAppear {
from {
opacity: 0;
transform: translateY(18px);
}

to {
    opacity: 1;
    transform: translateY(0);
}

}

@media (max-width: 480px) {
.auth-container {
margin: 25px auto;
padding: 26px 20px;
border-radius: 20px;
}
}

    </style>
</head>

<body>

    <div class="auth-container">

        <h1>🧸 Parent Account</h1>

        <p>Welcome to Nanhi Duniya ❤️</p>

        <form id="signupForm">

            <label for="parentName">Parent Name</label>
<input
type="text"
id="parentName"
placeholder="Enter parent's full name"
autocomplete="name"
required>

            <label for="parentEmail">Email Address</label>
            <input
                type="email"
                id="parentEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="parentPassword">Password</label>
            <input
                type="password"
                id="parentPassword"
                placeholder="Create a password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="signupButton">
                Create Account ❤️
            </button>

        </form>

        <p id="authMessage" aria-live="polite"></p>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

</body>
</html>
